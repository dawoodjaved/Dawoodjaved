<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-label="GitHub journey">
  <rect width="1100" height="180" rx="18" fill="#070B12" stroke="#1E2A3A"/>
  <text x="28" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">GitHub journey</text>
  <text x="1072" y="32" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#14B8A6">2,637 commits &#183; 529 merged PRs</text>

  <line x1="70" y1="100" x2="1030" y2="100" stroke="#1E2A3A" stroke-width="3"/>
  <line x1="70" y1="100" x2="1030" y2="100" stroke="#14B8A6" stroke-width="3" stroke-dasharray="960" stroke-dashoffset="960">
    <animate attributeName="stroke-dashoffset" from="960" to="0" dur="1.8s" fill="freeze"/>
  </line>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <circle cx="90" cy="100" r="9" fill="#14B8A6"/>
    <text x="90" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2019</text>
    <text x="90" y="138" font-size="11" fill="#94A3B8">Career start &#183; UET</text>

    <circle cx="270" cy="100" r="9" fill="#14B8A6"/>
    <text x="270" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2020</text>
    <text x="270" y="138" font-size="11" fill="#94A3B8">Hacktoberfest</text>

    <circle cx="450" cy="100" r="9" fill="#14B8A6"/>
    <text x="450" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2021</text>
    <text x="450" y="138" font-size="11" fill="#94A3B8">Client MVPs</text>

    <circle cx="630" cy="100" r="9" fill="#22D3EE"/>
    <text x="630" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2022</text>
    <text x="630" y="138" font-size="11" fill="#94A3B8">Joined EZO</text>

    <circle cx="810" cy="100" r="9" fill="#A78BFA"/>
    <text x="810" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2025</text>
    <text x="810" y="138" font-size="11" fill="#94A3B8">CodePair &#183; RN</text>

    <circle cx="990" cy="100" r="9" fill="#F59E0B"/>
    <text x="990" y="70" font-size="13" font-weight="700" fill="#F8FAFC">2026</text>
    <text x="990" y="138" font-size="11" fill="#94A3B8">GTM tooling</text>
  </g>
</svg>
