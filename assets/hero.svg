<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Dawood Javeed profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0B1622"/>
      <stop offset="100%" stop-color="#08201C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="340" rx="22" fill="url(#bg)"/>
  <circle cx="980" cy="40" r="90" fill="#14B8A6" opacity="0.12" filter="url(#soft)"/>
  <circle cx="120" cy="300" r="80" fill="#22D3EE" opacity="0.08" filter="url(#soft)"/>

  <!-- window chrome -->
  <rect width="1100" height="44" rx="22" fill="#0E141C"/>
  <rect y="22" width="1100" height="22" fill="#0E141C"/>
  <circle cx="28" cy="22" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="22" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="22" r="6" fill="#28C840"/>
  <rect x="330" y="12" width="440" height="20" rx="10" fill="#161E2B" stroke="#243044"/>
  <text x="550" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E">dawoodjaveed.com  portfolio</text>

  <!-- avatar -->
  <circle cx="108" cy="175" r="52" fill="none" stroke="url(#avatar)" stroke-width="3"/>
  <circle cx="108" cy="175" r="46" fill="#10202A"/>
  <text x="108" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="url(#glow)">DJ</text>
  <circle cx="146" cy="214" r="8" fill="#22C55E" stroke="#0B1622" stroke-width="3"/>

  <text x="180" y="128" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#14B8A6" letter-spacing="2">SENIOR FULL STACK ENGINEER</text>
  <text x="180" y="172" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC">Dawood Javeed</text>
  <text x="180" y="206" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" fill="#94A3B8">7vals (EZO) · Lahore · Rails · React · Integrations</text>

  <rect x="180" y="228" width="118" height="28" rx="14" fill="#10281F" stroke="#14B8A6"/>
  <circle cx="198" cy="242" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="247" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#86EFC0">Available</text>

  <rect x="308" y="228" width="168" height="28" rx="14" fill="#161E2B" stroke="#243044"/>
  <text x="392" y="247" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">Open to Senior / Staff</text>

  <rect x="486" y="228" width="132" height="28" rx="14" fill="#161E2B" stroke="#243044"/>
  <text x="552" y="247" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">5+ years</text>

  <!-- right stack -->
  <rect x="780" y="78" width="280" height="220" rx="16" fill="#0F1720" stroke="#1E2A3A"/>
  <text x="800" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#14B8A6">// live impact</text>
  <text x="800" y="148" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">83%</text>
  <text x="888" y="148" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#94A3B8">Work Orders latency</text>
  <text x="800" y="188" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">50K+</text>
  <text x="900" y="188" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#94A3B8">assets on GPS</text>
  <text x="800" y="228" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">98%</text>
  <text x="888" y="228" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#94A3B8">faster checkout</text>
  <rect x="800" y="248" width="240" height="6" rx="3" fill="#1E2A3A"/>
  <rect x="800" y="248" width="200" height="6" rx="3" fill="url(#glow)">
    <animate attributeName="width" values="40;200;200" dur="2.2s" fill="freeze"/>
  </rect>
</svg>
